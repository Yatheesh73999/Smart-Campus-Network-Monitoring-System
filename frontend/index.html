<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Smart Campus Network Monitoring System Dashboard</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Segoe UI", Roboto, Arial;
      background: #0f0f0f;
      color: #eee;
      padding: 20px;
    }
    h1 {
      text-align: center;
      font-size: 32px;
      margin-bottom: 10px;
      font-weight: 600;
    }
    #updated {
      text-align: center;
      font-size: 14px;
      color: #999;
      margin-bottom: 20px;
    }
    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #888;
      margin: -5px 0 15px 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: #1a1a1a;
      border-radius: 12px;
      padding: 15px;
      border: 1px solid #222;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    .name { font-size: 18px; font-weight: 600; }
    .ip { font-size: 13px; color: #bbb; margin-bottom: 8px; }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }
    .UP { background: rgba(0, 255, 100, 0.15); color: #4caf50; }
    .DOWN { background: rgba(255, 60, 60, 0.2); color: #ff4c4c; }

    .charts {
      margin-top: 40px;
    }
    canvas {
      background: #111;
      padding: 15px;
      margin-bottom: 40px;
      border-radius: 12px;
      border: 1px solid #222;
    }
  </style>
</head>
<body>

  <h1>Smart Campus Network Monitoring System Dashboard</h1>
  <div class="subtitle">Yatheesh Chandra,Vidhi Kamat </div>
  <div id="updated">Loading...</div>

  <!-- Device Cards -->
  <div class="grid" id="grid"></div>

  <!-- Charts -->
  <div class="charts">
    <h2>Live Performance Charts</h2>
    <canvas id="latencyChart" height="130"></canvas>
    <canvas id="cpuChart" height="130"></canvas>
  </div>

  <script>
    let latencyChart, cpuChart;

    function createCharts() {
      const ctx1 = document.getElementById('latencyChart').getContext('2d');
      const ctx2 = document.getElementById('cpuChart').getContext('2d');

      latencyChart = new Chart(ctx1, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{ label: 'Latency (ms)', data: [], borderWidth: 2 }]
        }
      });

      cpuChart = new Chart(ctx2, {
        type: 'line',
        data: {
          labels: [],
          datasets: [{ label: 'CPU Usage (%)', data: [], borderWidth: 2 }]
        }
      });
    }

    async function loadDevices() {
      const res = await fetch("/api/devices");
      const data = await res.json();

      const grid = document.getElementById("grid");
      grid.innerHTML = "";

      let latestLatency = null;
      let latestCPU = null;

      data.forEach(d => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="name">${d.device}</div>
          <div class="ip">${d.ip}</div>
          <div class="badge ${d.status}">${d.status}</div>
          <div>Latency: ${d.latency_ms ?? "-"} ms</div>
          <div>CPU: ${d.cpu_usage ?? "-"}%</div>
          <div>Memory: ${d.mem_free ?? "-"} MB</div>
        `;

        grid.appendChild(card);

        // Pick a device for graph data (Core Router recommended)
        if (d.device === "Core Router") {
          latestLatency = d.latency_ms;
          latestCPU = d.cpu_usage;
        }
      });

      if (latestLatency !== null) {
        const now = new Date().toLocaleTimeString();

        latencyChart.data.labels.push(now);
        latencyChart.data.datasets[0].data.push(latencyChart.data.datasets[0].data.length > 20 ? null : latestLatency);

        cpuChart.data.labels.push(now);
        cpuChart.data.datasets[0].data.push(cpuChart.data.datasets[0].data.length > 20 ? null : latestCPU);

        latencyChart.update();
        cpuChart.update();
      }

      document.getElementById("updated").innerText =
        "Last updated: " + new Date().toLocaleTimeString();
    }

    createCharts();
    loadDevices();
    setInterval(loadDevices, 5000);
  </script>

</body>
</html>
